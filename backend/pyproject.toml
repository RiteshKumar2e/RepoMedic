[project]
name = "repomedic-backend"
version = "0.1.0"
description = "RepoMedic — AI-powered repository-aware code review and auto-fix platform"
requires-python = ">=3.11"
license = { text = "MIT" }

[tool.ruff]
target-version = "py311"
line-length = 110
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM", "TCH", "RUF"]
ignore = ["E501", "B008"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
norecursedirs = ["fixtures", ".workspaces", "data", ".venv", "venv"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
    "e2e: full pipeline run against the fixture repository",
    "integration: exercises the HTTP API",
]

[tool.coverage.run]
source = ["app"]
omit = ["app/workers/*", "tests/*", "fixtures/*"]

[tool.coverage.report]
show_missing = true
fail_under = 40
